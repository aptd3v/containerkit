name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version sites
        run: python3 scripts/version.py --check

  pins:
    name: Upstream pin agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check pin copies
        run: |
          python3 scripts/pins.py --self-test
          python3 scripts/pins.py --check

  go:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Taskflow coverage
        run: |
          go test -coverprofile=taskflow.out ./pkg/taskflow
          go tool cover -func=taskflow.out | awk '{ gsub("%","",$NF); if ($NF+0 < 100) { print; bad=1 } } END { if (bad) exit 1 }'

      - name: pkg/kit coverage
        run: |
          go test -coverprofile=kit.out ./pkg/kit
          python3 scripts/ci/kitcover.py --self-test
          python3 scripts/ci/kitcover.py --floor 50 kit.out

      - name: Publish pkg/kit cover profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pkg-kit-cover
          path: kit.out
          if-no-files-found: error

      - name: Multi-platform binaries
        run: go run ./tools/crossbuild

      - name: Check dist archives
        run: |
          test -f dist/checksums.txt
          test "$(find dist \( -name 'containerkit_*.tar.gz' -o -name 'containerkit_*.zip' \) | wc -l | tr -d ' ')" = "6"
          (cd dist && sha256sum -c checksums.txt)

  tsx:
    name: TSX package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsx
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tsx/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Taskflow coverage
        run: npm run test:taskflow

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build platform binaries
        working-directory: ${{ github.workspace }}
        run: go run ./tools/crossbuild

      - name: Pack dry-run
        run: npm run pack:check

  engine:
    name: Engine
    # ubuntu-latest is 26.04. apt-get update exits 100 there, so the
    # docker-ce pin never installs. 24.04 publishes docker-ce 29.9.3.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tsx/package-lock.json

      - name: Pin Docker Engine 29.9.3
        env:
          ENGINE_VERSION: "29.9.3"
        run: bash scripts/ci/pin-engine.sh

      - name: Install TypeScript package
        working-directory: tsx
        run: |
          npm ci
          npm run build

      - name: Host binary
        run: go run ./tools/crossbuild

      - name: Live Engine proof
        env:
          ENGINE_VERSION: "29.9.3"
        run: bash scripts/ci/engine.sh

  advisory:
    name: Advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tsx/package-lock.json

      - name: npm audit
        working-directory: tsx
        run: npm audit --package-lock-only --include=dev --audit-level=high
